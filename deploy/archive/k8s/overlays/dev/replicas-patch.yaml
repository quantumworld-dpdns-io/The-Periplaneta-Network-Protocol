apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-worker
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: feature-worker
          resources:
            requests: { cpu: 500m, memory: 768Mi }
            limits: { cpu: "2", memory: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  replicas: 1
