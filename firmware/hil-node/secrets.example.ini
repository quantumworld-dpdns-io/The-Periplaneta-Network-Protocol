; Copy to secrets.ini (gitignored) and fill in. Read by platformio.ini via extra_configs.
;
; HIL_INDEX is NOT set here: it comes from the env you build (hil0 -> 0, hil1 -> 1),
; giving node ids ffff0000 / ffff0001. Both boards share this file.
[secrets]
wifi_ssid = MyLabWifi
wifi_pass = supersecret
; LAN IP of the laptop running docker compose (Mosquitto listens on host TCP 1883).
; Windows: ipconfig -> "IPv4 Address" of your Wi-Fi adapter. macOS/Linux: ip -4 addr / ifconfig.
mqtt_host = 192.168.1.10
mqtt_port = 1883
