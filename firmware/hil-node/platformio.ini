; Cockroach Internet -- HIL node firmware (ESP32-S3-DevKitC-1, Arduino framework)
;
; Build:  pio run -e hil0            (board #1 -> node ffff0000)
;         pio run -e hil1            (board #2 -> node ffff0001)
; Flash:  pio run -e hil0 -t upload  (add --upload-port COMx if several boards)
;
; Wi-Fi / MQTT credentials live in secrets.ini (gitignored). Copy
; secrets.example.ini -> secrets.ini and edit. Values in [secrets] below are
; only fallbacks so a clean checkout still compiles.

[platformio]
default_envs = hil0
extra_configs = secrets.ini

[secrets]
wifi_ssid = CHANGE_ME
wifi_pass = CHANGE_ME
mqtt_host = 192.168.1.10
mqtt_port = 1883

; Shared ESP32-S3 settings; hil0/hil1 extend this (keeps [env:native] board-free).
[esp32]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"0.1.0\"
    -DWIFI_SSID=\"${secrets.wifi_ssid}\"
    -DWIFI_PASS=\"${secrets.wifi_pass}\"
    -DMQTT_HOST=\"${secrets.mqtt_host}\"
    -DMQTT_PORT=${secrets.mqtt_port}
build_unflags = -std=gnu++11

[env:hil0]
extends = esp32
build_flags = ${esp32.build_flags} -DHIL_INDEX=0

[env:hil1]
extends = esp32
build_flags = ${esp32.build_flags} -DHIL_INDEX=1

; Host-side unit tests for the pure playback functions (needs a native g++):
;   pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -DHIL_INDEX=0 -DNATIVE_TEST -Iinclude -Isrc
build_src_filter = +<*> -<main.cpp>
test_build_src = yes
test_filter = test_playback
