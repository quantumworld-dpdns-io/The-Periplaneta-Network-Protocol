[package]
name = "api-gateway"
version = "0.1.0"
edition = "2021"
description = "Cockroach Internet - axum REST + WebSocket gateway between Redpanda and the dashboard"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
axum = { version = "0.7", features = ["ws", "json", "macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
rdkafka = { version = "0.37", features = ["cmake-build", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
futures = "0.3"
bytes = "1"
tokio-stream = { version = "0.1", features = ["sync"] }

[profile.release]
opt-level = 3
codegen-units = 4
