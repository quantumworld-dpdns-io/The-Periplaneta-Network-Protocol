[package]
name = "swarm-gen"
version = "0.1.0"
edition = "2021"
description = "Cockroach Internet - 100k digital-twin spike generator -> Redpanda swarm.bins"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util"] }
rdkafka = { version = "0.37", features = ["cmake-build", "tokio"] }
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
futures = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
